<svg xmlns="http://www.w3.org/2000/svg" xmlns:th="http://www.thymeleaf.org"
     th:attr="viewBox=${viewBox},width=${width},height=${height}" role="img"
     aria-label="Balances Equilibrium: swept amount per current balance">
<th:block th:utext="${comment}"/>
<!--
  Balances Equilibrium: the swept amount per current balance (krm-demo/ai-plans-instr, plans-math).
  The Thymeleaf template (XML mode) behind every picture; the geometry comes from SvgRenderer as layers of shapes.
  The frames: one per sampled balance; CSS :hover shows the frame under the mouse, or the default one.
-->
<title>Balances Equilibrium: swept amount per current balance</title>
<style>
svg{--ink:#18212c;--soft:#5a6777;--rule:#d6dde7;--bg:#fbfcfe}
@media (prefers-color-scheme: dark){svg{--ink:#e6ebf2;--soft:#9aa7b8;--rule:#3a4452;--bg:#141a22}}
.on{pointer-events:none}.f .on{visibility:hidden}.f:hover .on{visibility:visible}.frames:not(:hover) .d .on{visibility:visible}
.hit{fill:#000;fill-opacity:0;pointer-events:all}.f:hover .hit{fill:#8B5CF6;fill-opacity:.05}
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.m{font-family:Georgia,'Times New Roman',serif;font-style:italic}
</style>
<rect width="100%" height="100%" style="fill:var(--bg)"/>
<defs>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" style="stroke:#E24B4A;stroke-width:1;stroke-opacity:.35"/>
  </pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" style="fill:none;stroke:var(--soft);stroke-width:1.5"/>
  </marker>
</defs>
<g th:each="layer : ${layers}" th:attr="class=${layer.cls}">
  <th:block th:each="e : ${layer.shapes}" th:switch="${e.tag}">
    <line th:case="'line'" th:attr="x1=${e.x1},y1=${e.y1},x2=${e.x2},y2=${e.y2},style=${e.style},marker-end=${e.markerEnd}"/>
    <rect th:case="'rect'" th:attr="x=${e.x},y=${e.y},width=${e.width},height=${e.height},rx=${e.rx},fill=${e.fill},style=${e.style}"/>
    <circle th:case="'circle'" th:attr="cx=${e.cx},cy=${e.cy},r=${e.r},style=${e.style}"/>
    <path th:case="'path'" th:attr="d=${e.d},style=${e.style}"/>
    <text th:case="'text'" th:attr="x=${e.x},y=${e.y},text-anchor=${e.anchor},class=${e.cls},transform=${e.transform},style=${e.style}" th:utext="${e.body}"></text>
  </th:block>
  <g th:each="f : ${layer.frames}" th:attr="class=${f.cls}">
    <rect class="hit" th:attr="x=${f.x},y=${f.y},width=${f.width},height=${f.height}"/>
    <g class="on">
      <th:block th:each="e : ${f.shapes}" th:switch="${e.tag}">
        <line th:case="'line'" th:attr="x1=${e.x1},y1=${e.y1},x2=${e.x2},y2=${e.y2},style=${e.style},marker-end=${e.markerEnd}"/>
        <rect th:case="'rect'" th:attr="x=${e.x},y=${e.y},width=${e.width},height=${e.height},rx=${e.rx},fill=${e.fill},style=${e.style}"/>
        <circle th:case="'circle'" th:attr="cx=${e.cx},cy=${e.cy},r=${e.r},style=${e.style}"/>
        <path th:case="'path'" th:attr="d=${e.d},style=${e.style}"/>
        <text th:case="'text'" th:attr="x=${e.x},y=${e.y},text-anchor=${e.anchor},class=${e.cls},transform=${e.transform},style=${e.style}" th:utext="${e.body}"></text>
      </th:block>
    </g>
  </g>
</g>
</svg>
