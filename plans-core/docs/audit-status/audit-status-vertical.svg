<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 790" width="920" height="790" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-main" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/></marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/></marker>
    <marker id="arrow-in" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/></marker>
    <marker id="arrow-out" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/></marker>
    <g id="ground-symbol">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-18" y1="14" x2="18" y2="14" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-11" y1="21" x2="11" y2="21" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-4" y1="28" x2="4" y2="28" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="920" height="100%" fill="#f8fafc" rx="12"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#0f172a">AuditStatus State Machine</text>
  <text x="40" y="68" font-size="13" fill="#64748b">Workflow lifecycle with grounded terminal failure states</text>
  <g transform="translate(40, 88)">
    <rect x="0" y="0" width="560" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="22" cy="22" r="6" fill="#0f172a"/>
    <text x="35" y="26" font-size="12" fill="#334155">Initial</text>
    <rect x="85" y="13" width="18" height="18" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="110" y="26" font-size="12" fill="#334155">Transient</text>
    <rect x="185" y="13" width="18" height="18" rx="4" fill="#fde7c7" stroke="#b45309" stroke-width="2"/>
    <text x="210" y="26" font-size="12" fill="#9a3412" font-weight="600">Swept-In</text>
    <rect x="280" y="13" width="18" height="18" rx="4" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="305" y="26" font-size="12" fill="#0f766e" font-weight="600">Swept-Out</text>
    <g transform="translate(405, 11) scale(0.65)"><use href="#ground-symbol"/></g>
    <text x="425" y="26" font-size="12" fill="#dc2626" font-weight="600">Grounded Failure</text>
  </g>
  <circle cx="460" cy="160" r="7" fill="#0f172a"/>
  <line x1="460" y1="167" x2="460" y2="186" stroke="#475569" stroke-width="2" marker-end="url(#arrow-main)"/>
  <g transform="translate(400, 190)" filter="url(#shadow)">
    <rect width="120" height="44" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <text x="60.0" y="27" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">SCHEDULED</text>
  </g>
  <line x1="520" y1="212" x2="594" y2="212" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>
  <g transform="translate(600, 185)">
    <rect width="170" height="54" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="85" y="20" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">CHECK_ONE_FAILED</text>
    <line x1="12" y1="27" x2="158" y2="27" stroke="#fecaca" stroke-width="1"/>
    <text x="85" y="43" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">CHECK_ONE_TIMEOUT</text>
    <use href="#ground-symbol" x="85" y="54"/>
  </g>
  <line x1="460" y1="234" x2="460" y2="276" stroke="#475569" stroke-width="2" marker-end="url(#arrow-main)"/>
  <g transform="translate(382.5, 280)" filter="url(#shadow)">
    <rect width="155" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
    <text x="77.5" y="27" font-size="12.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">CHECK_ONE_PASSED</text>
  </g>
  <rect x="30" y="385" width="420" height="375" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-dasharray="4 4"/>
  <text x="50" y="410" text-anchor="start" font-size="12" font-weight="700" letter-spacing="0.05em" fill="#9a3412">SWEPT-IN BRANCH (LOW BALANCE)</text>
  <rect x="470" y="385" width="420" height="375" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-dasharray="4 4"/>
  <text x="870" y="410" text-anchor="end" font-size="12" font-weight="700" letter-spacing="0.05em" fill="#0f766e">SWEPT-OUT BRANCH (HIGH BALANCE)</text>
  <path d="M 445 324 L 445 352 L 355 352 L 355 434" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-in)"/>
  <rect x="361" y="342" width="78" height="20" rx="4" fill="#ffffff" stroke="#fdba74"/>
  <text x="400" y="356" font-size="11" font-weight="600" fill="#9a3412" text-anchor="middle">balance &lt; T</text>
  <path d="M 475 324 L 475 352 L 565 352 L 565 434" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-out)"/>
  <rect x="481" y="342" width="78" height="20" rx="4" fill="#ffffff" stroke="#5eead4"/>
  <text x="520" y="356" font-size="11" font-weight="600" fill="#0f766e" text-anchor="middle">balance ≥ T</text>
  <g transform="translate(272.5, 440)" filter="url(#shadow)">
    <rect width="165" height="44" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/>
    <text x="82.5" y="27" font-size="12.5" font-weight="600" fill="#7c2d12" text-anchor="middle">LOW_BALANCE</text>
  </g>
  <line x1="272.5" y1="462" x2="236" y2="462" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>
  <g transform="translate(60, 435)">
    <rect width="170" height="54" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="85" y="20" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">CHECK_LOW_FAILED</text>
    <line x1="12" y1="27" x2="158" y2="27" stroke="#fecaca" stroke-width="1"/>
    <text x="85" y="43" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">CHECK_LOW_TIMEOUT</text>
    <use href="#ground-symbol" x="85" y="54"/>
  </g>
  <line x1="355" y1="484" x2="355" y2="546" stroke="#b45309" stroke-width="2.2" marker-end="url(#arrow-in)"/>
  <g transform="translate(272.5, 550)" filter="url(#shadow)">
    <rect width="165" height="44" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/>
    <text x="82.5" y="27" font-size="12.5" font-weight="600" fill="#7c2d12" text-anchor="middle">CHECK_LOW_PASSED</text>
  </g>
  <line x1="355" y1="594" x2="355" y2="656" stroke="#b45309" stroke-width="2.2" marker-end="url(#arrow-in)"/>
  <g transform="translate(280, 660)" filter="url(#shadow)">
    <rect width="150" height="50" rx="10" fill="#fde7c7" stroke="#b45309" stroke-width="2.5"/>
    <rect x="4" y="4" width="142" height="42" rx="7" fill="none" stroke="#b45309" stroke-width="1"/>
    <text x="75" y="30" font-size="13.5" font-weight="700" fill="#7c2d12" text-anchor="middle">SWEPT_IN</text>
  </g>
  <g transform="translate(482.5, 440)" filter="url(#shadow)">
    <rect width="165" height="44" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.8"/>
    <text x="82.5" y="27" font-size="12.5" font-weight="600" fill="#134e4a" text-anchor="middle">HIGH_BALANCE</text>
  </g>
  <line x1="647.5" y1="462" x2="684" y2="462" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>
  <g transform="translate(690, 435)">
    <rect width="170" height="54" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="85" y="20" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">CHECK_HIGH_FAILED</text>
    <line x1="12" y1="27" x2="158" y2="27" stroke="#fecaca" stroke-width="1"/>
    <text x="85" y="43" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">CHECK_HIGH_TIMEOUT</text>
    <use href="#ground-symbol" x="85" y="54"/>
  </g>
  <line x1="565" y1="484" x2="565" y2="546" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arrow-out)"/>
  <g transform="translate(482.5, 550)" filter="url(#shadow)">
    <rect width="165" height="44" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.8"/>
    <text x="82.5" y="27" font-size="12.5" font-weight="600" fill="#134e4a" text-anchor="middle">CHECK_HIGH_PASSED</text>
  </g>
  <line x1="565" y1="594" x2="565" y2="656" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arrow-out)"/>
  <g transform="translate(490, 660)" filter="url(#shadow)">
    <rect width="150" height="50" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.5"/>
    <rect x="4" y="4" width="142" height="42" rx="7" fill="none" stroke="#0d9488" stroke-width="1"/>
    <text x="75" y="30" font-size="13.5" font-weight="700" fill="#134e4a" text-anchor="middle">SWEPT_OUT</text>
  </g>
</svg>
