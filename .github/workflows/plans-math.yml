name: plans-math
run-name: plans-math ${{ github.ref_name }}

# On every push to main that touches plans-math (a library: nothing is deployed but its documentation):
#   1. build and test (JUnit Jupiter, JaCoCo), turn the Open Test Reporting XML into HTML,
#   2. commit the GitHub Pages of the project to the gh-pages branch (Pages serves that branch):
#      plans-math/ — the interactive page (src/site: the JavaScript widget, the statuses, the palettes),
#      the library's adaptive SVG pictures, the test report (one picture per case), the coverage report
#      and the numbers of the README badges (shields.io endpoint JSON).
on:
  push:
    branches: [main]
    paths:
      - 'plans-math/**'
      - '.github/workflows/plans-math.yml'
  workflow_dispatch:

permissions:
  contents: write      # push to gh-pages

concurrency:
  group: plans-math-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -pl plans-math -am verify

      - name: Test reports (Open Test Reporting → HTML), demo and technical
        run: |
          for kind in demo tech; do
            XML=$(find plans-math/target/open-test-report/$kind -name 'open-test-report*.xml' | head -1)
            echo "$kind: $XML"
            test -n "$XML"
            mvn -B -q -pl plans-math exec:java@open-test-html -Dotr.xml="$XML" -Dotr.html="$(dirname "$XML")/index.html"
            echo "  $(find "$(dirname "$XML")" -name '*.svg' | wc -l) pictures"
          done

      - name: Pages content
        run: |
          # target/pages/plans-math holds the demo page, its scripts, the pictures and the badge numbers (DemoPage,
          # EquilibDocs); add the reports and the JavaDoc.
          P=site/plans-math
          mkdir -p $P/tests $P/jacoco $P/apidocs
          cp -r plans-math/target/pages/plans-math/. $P/
          for kind in demo tech; do
            mkdir -p $P/tests/$kind
            cp -r "$(dirname "$(find plans-math/target/open-test-report/$kind -name 'open-test-report*.xml' | head -1)")"/. $P/tests/$kind/
          done
          cp -r plans-math/target/site/jacoco/. $P/jacoco/
          cp -r plans-math/target/reports/apidocs/. $P/apidocs/
          printf '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=plans-math/"><a href="plans-math/">plans-math</a>\n' > site/index.html
          {
            echo "### plans-math"
            echo "- $(jq -r .message $P/badges/tests.json) · coverage $(jq -r .message $P/badges/coverage.json)"
            echo "- $(find $P/tests/demo -name '*.svg' | wc -l) pictures in the demo tests"
            echo "- https://krm-demo.github.io/ai-plans-instr/plans-math/"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: "plans-math: pages from ${{ github.sha }}"
          force_orphan: true      # only the latest pages: the pictures of old runs do not pile up in the history
