name: plans-math
run-name: plans-math ${{ github.ref_name }}

# Builds plans-math on every push to main that touches it, and deploys the jar to its Lambda (still named plan-equilib:
# the module was renamed, the function and its URL stay).
# AWS sign-in without keys: the role plan-equilib-deploy trusts only pushes to main of this repository
# and may only replace the code of this one function (see plans-math/deploy/setup.sh).
on:
  push:
    branches: [main]
    paths:
      - 'plans-math/**'
      - '.github/workflows/plans-math.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: plans-math-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  FUNCTION: plan-equilib
  DEPLOY_ROLE: arn:aws:iam::560574854768:role/plan-equilib-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -pl plans-math -am verify

      - name: Example pictures are committed
        run: |
          if ! git diff --exit-code -- plans-math/docs; then
            echo "::error::plans-math/docs is out of date. Run 'mvn -pl plans-math compile exec:java@docs' and commit it."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy the jar
        run: |
          aws lambda update-function-code --function-name "$FUNCTION" \
            --zip-file fileb://plans-math/target/plans-math.jar --query 'CodeSize' --output text
          aws lambda wait function-updated-v2 --function-name "$FUNCTION"

      - name: Smoke test
        run: |
          URL=$(aws lambda get-function-url-config --function-name "$FUNCTION" --query FunctionUrl --output text)
          curl -fsS -o /tmp/equilib.svg -w '%{http_code} %{content_type} %{size_download} bytes\n' "${URL}?size=M&frames=12"
          grep -q 'class="f d"' /tmp/equilib.svg
          {
            echo "### plans-math deployed (Lambda plan-equilib)"
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"
