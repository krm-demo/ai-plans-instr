name: manual-tests
run-name: manual-tests ${{ github.ref_name }} (${{ inputs.plans || '10000' }} plans)

# Started by hand only (Actions > manual-tests > Run workflow). Runs the tests tagged "manual"
# (CrudBenchmarkTest): the same CRUD scenario on local databases (H2, Zonky's embedded Postgres,
# DynamoDB Local) and on cloud ones (Aurora Serverless v2 PostgreSQL, DynamoDB), and shows the
# page that the test writes (target/manual-tests/summary.md) on the summary page of the run.
#
#   1. .github/actions/aurora up: creates Aurora and the DynamoDB table if they are not there
#      (about 10 minutes), starts the cluster if someone stopped it; a paused one wakes up on
#      the first connection (about 15 s), the test waits for it;
#   2. .github/actions/aurora open: port 5432 for the IP of this runner only (close at the end);
#   3. runs the tests, writes the summary.
# To create, stop or delete the databases without the tests: the workflow "aurora".
# The databases stay: Aurora pauses itself after 15 idle minutes, DynamoDB costs nothing idle.
#
# One-time setup: deploy infra/manual-tests-role.yaml and save its RoleArn as the repository
# variable MANUAL_TESTS_ROLE_ARN (Settings > Secrets and variables > Actions > Variables).
on:
  push:                    # TEMPORARY: to try the changes before they are on main
    branches: [manual-tests]
  workflow_dispatch:
    inputs:
      plans:
        description: How many plans to create, load, update and delete
        default: '10000'
      aurora:
        description: Aurora Serverless v2 PostgreSQL
        type: boolean
        default: true
      dynamodb:
        description: DynamoDB
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write      # sign in to AWS through OIDC, no stored keys

concurrency:
  group: manual-tests
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.MANUAL_TESTS_REGION || 'us-east-1' }}
  STACK: plans-manual-tests
  PLANS: ${{ inputs.plans || '10000' }}
  # without the role (not set up yet) only the embedded Postgres takes part
  # without the role (not set up yet) only the embedded databases take part
  WITH_AWS: ${{ vars.MANUAL_TESTS_ROLE_ARN != '' }}
  WITH_AURORA: ${{ vars.MANUAL_TESTS_ROLE_ARN != '' && (github.event_name != 'workflow_dispatch' || inputs.aurora) }}
  WITH_DYNAMODB: ${{ vars.MANUAL_TESTS_ROLE_ARN != '' && (github.event_name != 'workflow_dispatch' || inputs.dynamodb) }}

jobs:
  manual-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.WITH_AWS == 'true'
        with:
          role-to-assume: ${{ vars.MANUAL_TESTS_ROLE_ARN }}
          role-session-name: manual-tests-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Databases are up (created when missing, started when stopped)
        if: env.WITH_AWS == 'true'
        uses: ./.github/actions/aurora
        with:
          command: up

      - name: Open Postgres for this runner
        if: env.WITH_AWS == 'true'
        uses: ./.github/actions/aurora
        with:
          command: open

      - name: Only the chosen targets
        if: env.WITH_AWS == 'true'
        run: |
          [ "$WITH_AURORA" = "true" ] || echo "PLANS_PG_URL=" >> "$GITHUB_ENV"
          [ "$WITH_DYNAMODB" = "true" ] || echo "PLANS_DDB_TABLE=" >> "$GITHUB_ENV"

      - name: Manual tests
        run: mvn -B -pl plans-lambda -am test -Dgroups=manual -Dtests.excluded=none -Dmanual.plans=$PLANS

      # the test writes the page itself (BenchReport): what was measured, how to read it, the numbers
      - name: Summary
        if: always()
        run: |
          f=plans-lambda/target/manual-tests/summary.md
          if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; else echo "no $f: the tests did not get that far" >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-tests
          path: |
            plans-lambda/target/manual-tests/
            plans-lambda/target/surefire-reports/
          retention-days: 30

      - name: Close Postgres again
        if: always() && env.AURORA_RUNNER_IP != ''
        uses: ./.github/actions/aurora
        with:
          command: close
