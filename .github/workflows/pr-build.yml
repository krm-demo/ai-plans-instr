name: pr-build
run-name: pr-build ${{ github.head_ref || github.ref_name }}

# Build and test every pull request, whatever its target branch (stacked PRs included),
# and every push to main (direct commits). Replaced by ci.yml once that lands on main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Regenerate state charts on their own
        run: mvn -B -pl plans-core exec:java@state-charts

      - name: Generated state charts are committed
        run: |
          if ! git diff --exit-code -- '*/doc-files/*.svg'; then
            echo "::error::The state-chart SVGs are out of date. Run 'mvn -pl plans-core test-compile exec:java@state-charts' and commit them."
            exit 1
          fi

      - name: Test summary
        if: always()
        run: |
          {
            echo "### Tests"
            echo '```'
            grep -h -o 'Tests run: [0-9]*, Failures: [0-9]*, Errors: [0-9]*, Skipped: [0-9]*.*- in [^ ]*' \
              */target/surefire-reports/*.txt 2>/dev/null || echo "no surefire reports"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: surefire-reports
          path: '*/target/surefire-reports/'
          retention-days: 7
