name: Release

# Runs when you publish a release on GitHub (tag like v0.1.0).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # lets the job sign in to AWS without access keys

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Use the release tag as the version (v0.1.0 -> 0.1.0)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mvn -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build and test (also creates the Lambda jar)
        run: mvn -B verify -Dbuild.number="${{ github.run_number }}-${GITHUB_SHA:0:7}"

      - name: Upload the library to Maven Central
        run: mvn -B deploy -pl core -am -Prelease -DskipTests
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2

      - name: Deploy database, Lambdas and API to AWS
        run: |
          sam deploy \
            --template-file infra/template.yaml \
            --stack-name plans \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Update the database schema
        run: |
          FN=$(aws cloudformation describe-stacks --stack-name plans \
            --query "Stacks[0].Outputs[?OutputKey=='MigrateFunctionName'].OutputValue" --output text)
          ERR=$(aws lambda invoke --function-name "$FN" \
            --cli-binary-format raw-in-base64-out --payload '{}' \
            --query FunctionError --output text /tmp/migrate.json)
          cat /tmp/migrate.json
          [ "$ERR" = "None" ]
