name: release

# Publish a release on GitHub (tag v0.1.0, v0.2.0, ...) and this workflow
#   1. builds and tests the exact tagged commit,
#   2. uploads plans-core (jar + sources + javadoc, signed) to Maven Central,
#   3. attaches the jars to the GitHub release.
# Deploying to AWS is done by ci.yml on every push to main, not here.
on:
  release:
    types: [ published ]

permissions:
  contents: write   # needed to attach the jars to the release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Use the release tag as the version (v0.1.0 -> 0.1.0)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mvn -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build and test
        run: mvn -B verify -Dbuild.number="release-${GITHUB_REF_NAME}"

      - name: Upload plans-core to Maven Central
        run: mvn -B deploy -pl plans-core -am -Prelease -DskipTests
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Attach the jars to the GitHub release
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            plans-core/target/plans-core-*.jar \
            plans-lambda/target/plans-lambda-shaded.jar --clobber
        env:
          GH_TOKEN: ${{ github.token }}
